<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CathlabFlix Sessions</title>
  <meta name="description" content="CathlabFlix Sessions - Assista às transmissões e gravações científicas exclusivas de cardiologia intervencionista.">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://www.cathlabflix.org/">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.cathlabflix.org/">
  <meta property="og:title" content="CathlabFlix Sessions">
  <meta property="og:description" content="Assista às transmissões e gravações científicas exclusivas do CathlabFlix.">
  <meta property="og:image" content="https://cathlabflix-sessions.vercel.app/assets/images/og-cathlabflix.png">
  <meta property="og:image:secure_url" content="https://cathlabflix-sessions.vercel.app/assets/images/og-cathlabflix.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:alt" content="Logo CathlabFlix">
  <meta property="og:image" content="https://cathlabflix-sessions.vercel.app/assets/images/logo-cathlabflix.png">
  <meta property="og:site_name" content="CathlabFlix by SBHCI">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://www.cathlabflix.org/">
  <meta name="twitter:title" content="CathlabFlix Sessions">
  <meta name="twitter:description" content="Assista às transmissões e gravações científicas exclusivas do CathlabFlix.">
  <meta name="twitter:image" content="https://cathlabflix-sessions.vercel.app/assets/images/og-cathlabflix.png">

  <!-- Tipografia Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-dark-top: #051336;
      --bg-dark-mid: #0a1f54;
      --bg-dark-bot: #030a1d;
      --accent-cyan: #38bdf8;
      --accent-red: #ff1e38;
      --font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: var(--font-family);
      background: radial-gradient(ellipse 100% 70% at 50% 25%, var(--bg-dark-mid) 0%, var(--bg-dark-top) 45%, var(--bg-dark-bot) 100%);
      background-attachment: fixed;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .portal-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3.5rem 1.5rem 2rem;
    }

    .portal-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 980px;
    }

    /* Logo CathlabFlix */
    .brand-header {
      margin-bottom: 2.75rem;
      text-align: center;
    }

    .brand-logo-link {
      display: inline-block;
      text-decoration: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .brand-logo-link:hover {
      transform: scale(1.03);
      opacity: 0.95;
    }

    .brand-logo {
      width: 240px;
      max-width: 80vw;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }

    /* Card Evento SOLACI */
    .event-card-container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
    }

    .event-card {
      display: block;
      text-decoration: none;
      border-radius: 16px;
      overflow: hidden;
      background: #0d1e44;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 
        0 20px 45px -10px rgba(0, 0, 0, 0.65),
        0 0 30px rgba(10, 31, 84, 0.6);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
    }

    .event-card:hover, .event-card:focus-visible {
      transform: translateY(-6px) scale(1.02);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 
        0 28px 55px -12px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(56, 189, 248, 0.25);
      outline: none;
    }

    .event-card-img-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 488 / 275;
      background: #000;
      overflow: hidden;
    }

    .event-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .event-card:hover .event-card-img {
      transform: scale(1.03);
    }

    /* Footer */
    .portal-footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.45);
      font-weight: 400;
      letter-spacing: 0.2px;
      line-height: 1.6;
      max-width: 820px;
      margin-left: auto;
      margin-right: auto;
    }

    .portal-footer a {
      color: rgba(255, 255, 255, 0.65);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }

    .portal-footer a:hover {
      color: var(--accent-cyan, #38bdf8);
    }

    @media (max-width: 640px) {
      .portal-wrapper {
        padding: 2.5rem 1rem 1.75rem;
      }
      .brand-header {
        margin-bottom: 2rem;
      }
      .brand-logo {
        width: 200px;
      }
      .event-card {
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="portal-wrapper">
    <main class="portal-main">
      
      <!-- Topo: Logo Oficial CathlabFlix -->
      <header class="brand-header">
        <a href="https://www.cathlabflix.org/" class="brand-logo-link" title="CathlabFlix" target="_blank" rel="noopener noreferrer">
          <img 
            src="/assets/images/logo-cathlabflix.png" 
            alt="CathlabFlix" 
            class="brand-logo"
            width="240"
            height="70"
          >
        </a>
      </header>

      <!-- Conteúdo: Card SOLACI 2026 com link para /solaci -->
      <section class="event-card-container">
        <a href="/solaci" class="event-card" title="Acessar SOLACI SBHCI 2026">
          <div class="event-card-img-wrapper">
            <img 
              src="/assets/images/solaci-2026-confira.png" 
              alt="SOLACI SBHCI 2026 - Confira" 
              class="event-card-img"
              width="488"
              height="275"
            >
          </div>
        </a>
      </section>

    </main>

    <!-- Rodapé -->
    <footer class="portal-footer">
      <p>CathlabFlix by SBHCI - Copyright &copy; Sociedade Brasileira de Hemodinâmica e Cardiologia Intervencionista - <a href="https://politicas-lgpd.s3.sa-east-1.amazonaws.com/11jun21-SBHCI-99-01-2020-Serv960-politica-de-privacidade-LGPD.pdf" target="_blank" rel="noopener noreferrer">Política de Privacidade</a></p>
    </footer>
  </div>

</body>
</html>
