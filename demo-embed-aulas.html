<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cathlabflix Sessions - Demonstração do Embed de Aulas</title>

  <!-- Tipografia Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      /* Exemplo de fundo escuro do site externo */
      background-color: #040d2d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* Contêiner da área central do seu site */
    .site-container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
    }

    .demo-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Iframe Responsivo do Cathlabflix Sessions (Aulas) */
    .cathlabflix-aulas-iframe {
      width: 100%;
      max-width: 980px;
      height: 250px;
      border: none;
      display: block;
      margin: 0 auto;
      background: transparent;
      overflow: hidden;
      transition: height 0.25s ease-out;
    }
  </style>
</head>
<body>

  <!-- Demonstração do Embed de Aulas -->
  <div class="site-container">
    <div style="text-align: center; margin-bottom: 2rem;">
      <span class="demo-badge">Demonstração Externa • Embed de Aulas</span>
      <p style="color: #94a3b8; font-size: 0.95rem; margin-top: 0.5rem;">
        Esta página simula o seu próprio site incorporando a grade de Aulas via Script de 1 Linha ou Iframe com auto-ajuste dinâmico.
      </p>
    </div>

    <!-- Opção 1: Embed Script de 1 Linha -->
    <div id="cathlabflix-aulas"></div>
    <script src="/embed-aulas.js"></script>

  </div>

</body>
</html>
