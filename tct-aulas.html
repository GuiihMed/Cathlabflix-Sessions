<!DOCTYPE html>
<html lang="pt-BR" data-theme="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Grade de Aulas e Apresentações - TCT Plus Latam Valves 2026 - CathlabFlix</title>

  <!-- Favicon Oficial -->

  <link rel="apple-touch-icon" href="https://cathlabflix-sessions.vercel.app/assets/images/favicon.png">

  <!-- Open Graph / Redes Sociais -->
  <meta property="og:type" content="website">

  <!-- Tipografia Montserrat Oficial SBHCI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root, [data-theme="blue"] {
      --color-bg-base: #010234;
      --color-surface: #062257;
      --color-surface-hover: #082b6e;
      --color-surface-elevated: #0a2d72;
      --color-text-primary: #FFFFFF;
      --color-text-secondary: #94a3b8;
      --color-text-tertiary: #64748b;
      --color-primary: #E50914;
      --color-primary-hover: #B80710;
      --color-blue-accent: #38bdf8;
      --color-border-subtle: rgba(255, 255, 255, 0.12);
      --color-border-strong: rgba(255, 255, 255, 0.22);
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-pill: 9999px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
      --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.35);
      --font-family-base: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-base: 0.25s ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: var(--color-bg-base) !important;
      color: var(--color-text-primary) !important;
      font-family: var(--font-family-base) !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden !important;
    }

    .app-container {
      min-height: 100vh;
      background-color: var(--color-bg-base);
      display: flex;
      flex-direction: column;
    }

    /* Container Principal */
    .aulas-page-main {
      width: 96%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 12px 60px;
      box-sizing: border-box;
      flex: 1;
    }

    /* Barra Superior com Botão Voltar ao TCT Plus */
    .aulas-top-nav-bar {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .aulas-back-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-surface);
      border: 1px solid var(--color-border-subtle);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      text-decoration: none;
      transition: all var(--transition-fast);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .aulas-back-link:hover {
      background: var(--color-surface-hover);
      border-color: rgba(56, 189, 248, 0.5);
      color: var(--color-blue-accent);
      transform: translateX(-3px);
    }

    /* Hero Header */
    .aulas-hero-header {
      margin-bottom: 24px;
    }

    .aulas-header-title {
      font-size: clamp(1.4rem, 2.8vw, 2rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      margin: 0;
      line-height: 1.2;
    }

    .red-line {
      width: 50px;
      height: 3px;
      background: var(--color-primary, #E50914);
      margin-top: 8px;
      margin-bottom: 16px;
      border-radius: 2px;
    }

    /* Card Shell Principal */
    .aulas-card-shell {
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--color-border-subtle);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transition: box-shadow var(--transition-base);
    }

    /* ==========================================================================
       ABAS DE SALAS PRINCIPAIS (HEART TEAM ARENA, TRAINING HALL, ICOACH, etc.)
       ========================================================================== */
    .aulas-rooms-nav {
      display: flex;
      align-items: stretch;
      background: rgba(1, 2, 52, 0.88);
      border-bottom: 1px solid var(--color-border-subtle);
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .aulas-rooms-nav::-webkit-scrollbar {
      display: none;
    }

    .aulas-room-tab-btn {
      flex: 1 1 0;
      min-width: 140px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 14px;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--color-text-secondary);
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
      text-align: center;
    }

    .aulas-room-tab-btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.04);
    }

    .aulas-room-tab-btn.active {
      color: #FFFFFF;
      background: rgba(6, 34, 87, 0.7);
      border-bottom-color: var(--color-primary);
    }

    .room-tab-badge {
      font-size: 0.6875rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.12);
      color: inherit;
    }

    .aulas-room-tab-btn.active .room-tab-badge {
      background: var(--color-primary);
      color: #FFFFFF;
    }

    /* ==========================================================================
       SUB-ABAS DE SESSÃO / DIAS (19-03 - Manhã - Arena, etc.)
       ========================================================================== */
    .aulas-subtabs-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      background: rgba(4, 18, 47, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .aulas-subtabs-bar::-webkit-scrollbar {
      display: none;
    }

    .aulas-subtab-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .aulas-subtab-btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .aulas-subtab-btn.active {
      color: #FFFFFF;
      background: rgba(56, 189, 248, 0.16);
      border-color: var(--color-blue-accent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
    }

    /* Toolbar de Período & Busca */
    .aulas-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      background: rgba(1, 2, 52, 0.65);
      border-bottom: 1px solid var(--color-border-subtle);
      flex-wrap: wrap;
    }

    .aulas-period-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(1, 2, 52, 0.7);
      padding: 4px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--color-border-subtle);
    }

    .aulas-period-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--color-text-secondary);
      background: transparent;
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }

    .aulas-period-btn:hover {
      color: #FFFFFF;
      background: rgba(255, 255, 255, 0.06);
    }

    .aulas-period-btn.active {
      background: var(--color-primary);
      color: #FFFFFF;
      box-shadow: 0 2px 10px rgba(229, 9, 20, 0.35);
    }

    .period-btn-count {
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.12);
      color: inherit;
    }

    /* Search Box */
    .aulas-search-box {
      position: relative;
      width: 100%;
      max-width: 360px;
    }

    .aulas-search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-tertiary);
      pointer-events: none;
    }

    .aulas-search-input {
      width: 100%;
      height: 40px;
      padding: 0 38px 0 40px;
      font-family: inherit;
      font-size: 0.875rem;
      color: #FFFFFF;
      background: #010234;
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-pill);
      outline: none;
      transition: all var(--transition-fast);
      box-sizing: border-box;
    }

    .aulas-search-input::placeholder {
      color: var(--color-text-tertiary);
    }

    .aulas-search-input:focus {
      border-color: var(--color-blue-accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .aulas-search-clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--color-text-tertiary);
      cursor: pointer;
      display: none;
      padding: 4px;
    }

    .aulas-search-clear-btn:hover {
      color: #FFFFFF;
    }

    /* Periods Group Section */
    .aulas-period-section {
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .aulas-period-section:last-child {
      border-bottom: none;
    }

    .aulas-period-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      background: rgba(1, 2, 52, 0.45);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .aulas-period-header-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .aulas-period-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .aulas-period-icon-wrap {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .aulas-period-icon-wrap.sun {
      background: rgba(245, 158, 11, 0.18);
      color: #FBBF24;
    }

    .aulas-period-icon-wrap.sunset {
      background: rgba(249, 115, 22, 0.18);
      color: #FB923C;
    }

    .aulas-period-title {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.2;
    }

    .aulas-period-range-tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.08);
      color: #CBD5E1;
    }

    .aulas-period-desc {
      margin: 0;
      font-size: 0.8125rem;
      color: var(--color-text-secondary);
    }

    .aulas-period-count-pill {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--color-blue-accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(56, 189, 248, 0.25);
      white-space: nowrap;
    }

    /* Accordion List */
    .aulas-list-wrapper {
      display: flex;
      flex-direction: column;
    }

    .aulas-accordion-item {
      border-bottom: 1px solid var(--color-border-subtle);
      transition: background var(--transition-fast);
    }

    .aulas-accordion-item:last-child {
      border-bottom: none;
    }

    .aulas-accordion-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      color: inherit;
      transition: background var(--transition-fast);
    }

    .aulas-accordion-header:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .aulas-accordion-item.open .aulas-accordion-header {
      background: rgba(56, 189, 248, 0.08);
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .aulas-header-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .aulas-header-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .aula-time-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-xs);
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      letter-spacing: 0.3px;
    }

    .aula-room-tag {
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-xs);
      background: rgba(229, 9, 20, 0.2);
      color: #ff6b6b;
      text-transform: uppercase;
    }

    .aula-period-tag {
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-xs);
      background: rgba(56, 189, 248, 0.2);
      color: var(--color-blue-accent);
      text-transform: uppercase;
    }

    .aulas-item-speaker {
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--color-blue-accent);
    }

    .aulas-item-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.4;
      margin: 0;
    }

    .aulas-item-chevron {
      color: var(--color-text-secondary);
      transition: transform var(--transition-fast), color var(--transition-fast);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .aulas-accordion-item.open .aulas-item-chevron {
      transform: rotate(180deg);
      color: var(--color-blue-accent);
    }

    /* Accordion Body */
    .aulas-accordion-body {
      display: none;
      padding: 16px 20px;
      background: rgba(1, 2, 52, 0.5);
    }

    .aulas-accordion-item.open .aulas-accordion-body {
      display: block;
    }

    /* PPTX Card */
    .aulas-pptx-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      background: rgba(6, 34, 87, 0.7);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-md);
      transition: border-color var(--transition-fast);
    }

    .aulas-pptx-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
    }

    .aulas-pptx-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: #D24726;
      color: #FFFFFF;
      font-weight: 800;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(210, 71, 38, 0.35);
    }

    .aulas-pptx-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow: hidden;
    }

    .aulas-pptx-name {
      font-size: 0.875rem;
      font-weight: 600;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .aulas-pptx-meta {
      font-size: 0.75rem;
      color: var(--color-text-secondary);
    }

    .aulas-pptx-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .aulas-pptx-download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      padding: 0 18px;
      gap: 8px;
      border-radius: var(--radius-pill);
      font-size: 0.8125rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all var(--transition-fast);
      font-family: inherit;
      background: var(--color-primary);
      color: #FFFFFF;
      border: 1px solid var(--color-primary);
      box-shadow: 0 2px 8px rgba(229, 9, 20, 0.35);
      white-space: nowrap;
    }

    .aulas-pptx-download-btn:hover {
      background: var(--color-primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(229, 9, 20, 0.5);
    }

    /* Empty state */
    .aulas-empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--color-text-secondary);
      font-size: 0.9375rem;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .aulas-page-main {
        padding: 16px 12px 40px !important;
      }
      .aulas-rooms-nav {
        justify-content: flex-start;
      }
      .aulas-room-tab-btn {
        min-width: 120px;
        font-size: 0.75rem;
        padding: 12px 10px;
      }
      .aulas-toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .aulas-period-switch {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }
      .aulas-period-btn {
        justify-content: center;
        padding: 8px 4px;
        font-size: 0.75rem;
      }
      .aulas-search-box {
        max-width: 100%;
      }
      .aulas-pptx-card {
        flex-direction: column;
        align-items: stretch;
      }
      .aulas-pptx-download-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <main class="aulas-page-main" id="aulasMainContent">

      <!-- Botão Voltar ao TCT Plus -->
      <nav class="aulas-top-nav-bar" aria-label="Navegação de retorno">
        <a href="https://www.cathlabflix.org/tct" target="_top" class="aulas-back-link" title="Voltar ao TCT Plus">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Voltar ao TCT Plus</span>
        </a>
      </nav>

      <!-- Cabeçalho Principal -->
      <header class="aulas-hero-header">
        <h1 class="aulas-header-title">Grade de Aulas e Apresentações - TCT Plus Latam Valves 2026</h1>
        <div class="red-line"></div>
      </header>

      <!-- Card Principal de Apresentações -->
      <section class="aulas-card-shell" aria-label="Navegador de Aulas e Apresentações">

        <!-- 1. Abas Superiores de Salas (Heart Team Arena, Training Hall, iCoach, Spotlight, Scientific Corner) -->
        <nav class="aulas-rooms-nav" id="aulasRoomsNav" role="tablist" aria-label="Salas do Evento">
          <button type="button" class="aulas-room-tab-btn active" data-room="all" role="tab" aria-selected="true">
            <span>Todas as Salas</span>
            <span class="room-tab-badge" id="countAllRooms">22</span>
          </button>
          <button type="button" class="aulas-room-tab-btn" data-room="arena" role="tab" aria-selected="false">
            <span>Heart Team Arena</span>
            <span class="room-tab-badge" id="countArena">9</span>
          </button>
          <button type="button" class="aulas-room-tab-btn" data-room="training" role="tab" aria-selected="false">
            <span>Training Hall</span>
            <span class="room-tab-badge" id="countTraining">3</span>
          </button>
          <button type="button" class="aulas-room-tab-btn" data-room="icoach" role="tab" aria-selected="false">
            <span>iCoach</span>
            <span class="room-tab-badge" id="countIcoach">4</span>
          </button>
          <button type="button" class="aulas-room-tab-btn" data-room="spotlight" role="tab" aria-selected="false">
            <span>Spotlight</span>
            <span class="room-tab-badge" id="countSpotlight">3</span>
          </button>
          <button type="button" class="aulas-room-tab-btn" data-room="scientific" role="tab" aria-selected="false">
            <span>Scientific Corner</span>
            <span class="room-tab-badge" id="countScientific">3</span>
          </button>
        </nav>

      function sendResizeMessage() {
        try {
          const height = Math.max(
            document.body.scrollHeight || 0,
            document.documentElement.scrollHeight || 0,
            document.body.offsetHeight || 0
          );
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'setHeight', height: height + 35 }, '*');
            window.parent.postMessage({ type: 'cathlabflix-sessions-resize', height: height + 35 }, '*');
          }
        } catch (e) {}
      }

      function escapeHTML(str) {
        if (!str) return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderSubtabsBar() {
        dom.subtabsBar.innerHTML = '';
        if (currentRoom === 'all') {
          dom.subtabsBar.style.display = 'none';
          return;
        }

        const subtabs = ROOM_SUBTABS[currentRoom] || [];
        if (subtabs.length === 0) {
          dom.subtabsBar.style.display = 'none';
          return;
        }

        dom.subtabsBar.style.display = 'flex';

        // Sempre adiciona "Todas as Sessões" primeiro caso não esteja explícito
        const hasAll = subtabs.some(s => s.key === 'all');
        const listToRender = hasAll ? subtabs : [{ key: 'all', label: 'Todas as Sessões' }, ...subtabs];

        listToRender.forEach(st => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'aulas-subtab-btn' + (currentSubtab === st.key ? ' active' : '');
          btn.textContent = st.label;
          btn.addEventListener('click', () => {
            currentSubtab = st.key;
            dom.subtabsBar.querySelectorAll('.aulas-subtab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderAulas();
          });
          dom.subtabsBar.appendChild(btn);
        });
      }

      function getFilteredAulas() {
        return AULAS.filter(aula => {
          // Filtro por Sala
          if (currentRoom !== 'all' && aula.roomKey !== currentRoom) {
            return false;
          }
          // Filtro por Sub-aba de Sessão
          if (currentSubtab !== 'all' && aula.subtabKey !== currentSubtab) {
            return false;
          }
          // Filtro por Período
          if (currentPeriod !== 'all' && aula.periodKey !== currentPeriod) {
            return false;
          }
          // Busca textual
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase().trim();
            const titleMatch = (aula.title || '').toLowerCase().includes(q);
            const speakerMatch = (aula.speaker || '').toLowerCase().includes(q);
            const timeMatch = (aula.time || '').toLowerCase().includes(q);
            const roomMatch = (aula.room || '').toLowerCase().includes(q);
            const subtabMatch = (aula.subtab || '').toLowerCase().includes(q);
            if (!titleMatch && !speakerMatch && !timeMatch && !roomMatch && !subtabMatch) return false;
          }
          return true;
        });
      }

          </button>
          <div class="aulas-accordion-body">
            <div class="aulas-pptx-card">
              <div class="aulas-pptx-badge">PPTX</div>
              <div class="aulas-pptx-info">
                <span class="aulas-pptx-name">${escapeHTML(aula.file.name)}</span>
                <span class="aulas-pptx-meta">Apresentação Oficial • Sala: ${escapeHTML(aula.room)} • Tamanho: ${escapeHTML(aula.file.size)}</span>
              </div>
              <div class="aulas-pptx-actions">
                <a href="${escapeHTML(aula.file.downloadUrl)}" class="aulas-pptx-download-btn" title="Baixar material da aula" onclick="event.preventDefault(); alert('Material científico disponível para download oficial dos inscritos TCT Plus Latam Valves 2026.');">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                  </svg>
                  <span>Baixar Apresentação</span>
                </a>
              </div>
            </div>
          </div>
        `;

        const btn = item.querySelector('.aulas-accordion-header');
        btn.addEventListener('click', () => {
          if (openAulaIds.has(aula.id)) {
            openAulaIds.delete(aula.id);
            item.classList.remove('open');
            btn.setAttribute('aria-expanded', 'false');
          } else {
            openAulaIds.add(aula.id);
            item.classList.add('open');
            btn.setAttribute('aria-expanded', 'true');
          }
          sendResizeMessage();
        });

        return item;
      }

      function renderAulas() {
        const filtered = getFilteredAulas();
        dom.container.innerHTML = '';

        if (filtered.length === 0) {
          dom.container.innerHTML = `
            <div class="aulas-empty-state">
              <p>Nenhuma apresentação encontrada para os critérios selecionados.</p>
            </div>
          `;
          sendResizeMessage();
          return;
        }

        // Caso sala = 'all' e período = 'all' e sem busca, agrupa amigavelmente
        if (currentPeriod === 'all' && currentSubtab === 'all' && searchQuery.trim() === '') {
          const manhaList = filtered.filter(a => a.periodKey === 'manha');
          const tardeList = filtered.filter(a => a.periodKey === 'tarde');

          if (manhaList.length > 0) {
            const section = document.createElement('section');
            section.className = 'aulas-period-section';
            section.innerHTML = `
              <div class="aulas-period-header">
                <div class="aulas-period-header-left">
                  <div class="aulas-period-title-group">
                    <span class="aulas-period-icon-wrap sun">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                      </svg>
                    </span>
                    <h2 class="aulas-period-title">Manhã</h2>
                    <span class="aulas-period-range-tag">08:00 às 12:00</span>
                  </div>
                  <p class="aulas-period-desc">Conferências científicas e casos gravados do período matutino</p>
                </div>
                <span class="aulas-period-count-pill">${manhaList.length} apresentações</span>
              </div>
            `;
            const listWrapper = document.createElement('div');
            listWrapper.className = 'aulas-list-wrapper';
            manhaList.forEach(aula => listWrapper.appendChild(createAulaItem(aula)));
            section.appendChild(listWrapper);
            dom.container.appendChild(section);
          }

          if (tardeList.length > 0) {
            const section = document.createElement('section');
            section.className = 'aulas-period-section';
            section.innerHTML = `
              <div class="aulas-period-header">
                <div class="aulas-period-header-left">
                  <div class="aulas-period-title-group">
                    <span class="aulas-period-icon-wrap sunset">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M17 18a5 5 0 0 0-10 0"></path>
                        <line x1="12" y1="9" x2="12" y2="2"></line>
                        <line x1="4.22" y1="10.22" x2="5.64" y2="11.64"></line>
                        <line x1="1" y1="18" x2="3" y2="18"></line>
                        <line x1="21" y1="18" x2="23" y2="18"></line>
                        <line x1="18.36" y1="11.64" x2="19.78" y2="10.22"></line>
                        <line x1="23" y1="22" x2="1" y2="22"></line>
                      </svg>
                    </span>
                    <h2 class="aulas-period-title">Tarde / Noite</h2>
                    <span class="aulas-period-range-tag">12:00 às 23:30</span>
                  </div>
                  <p class="aulas-period-desc">Apresentações temáticas e discussões técnicas do período vespertino e noturno</p>
                </div>
                <span class="aulas-period-count-pill">${tardeList.length} apresentações</span>
              </div>
            `;
            const listWrapper = document.createElement('div');
            listWrapper.className = 'aulas-list-wrapper';
            tardeList.forEach(aula => listWrapper.appendChild(createAulaItem(aula)));
            section.appendChild(listWrapper);
            dom.container.appendChild(section);
          }
        } else {
          const listWrapper = document.createElement('div');
          listWrapper.className = 'aulas-list-wrapper';
          filtered.forEach(aula => listWrapper.appendChild(createAulaItem(aula)));
          dom.container.appendChild(listWrapper);
        }

        sendResizeMessage();
      }

      function updateCounts() {
        const manhaCount = AULAS.filter(a => a.periodKey === 'manha').length;
        const tardeCount = AULAS.filter(a => a.periodKey === 'tarde').length;
        if (dom.countAllPeriod) dom.countAllPeriod.textContent = AULAS.length;
        if (dom.countManhaPeriod) dom.countManhaPeriod.textContent = manhaCount;
        if (dom.countTardePeriod) dom.countTardePeriod.textContent = tardeCount;

        const arenaCount = AULAS.filter(a => a.roomKey === 'arena').length;
        const trainingCount = AULAS.filter(a => a.roomKey === 'training').length;
        const icoachCount = AULAS.filter(a => a.roomKey === 'icoach').length;
        const spotlightCount = AULAS.filter(a => a.roomKey === 'spotlight').length;
        const scientificCount = AULAS.filter(a => a.roomKey === 'scientific').length;

        if (dom.countAllRooms) dom.countAllRooms.textContent = AULAS.length;
        if (dom.countArena) dom.countArena.textContent = arenaCount;
        if (dom.countTraining) dom.countTraining.textContent = trainingCount;
        if (dom.countIcoach) dom.countIcoach.textContent = icoachCount;
        if (dom.countSpotlight) dom.countSpotlight.textContent = spotlightCount;
        if (dom.countScientific) dom.countScientific.textContent = scientificCount;
      }

      // Event Listeners para Salas
      dom.roomButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          dom.roomButtons.forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-selected', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          currentRoom = btn.dataset.room;
          currentSubtab = 'all';
          renderSubtabsBar();
          renderAulas();
        });
      });

      // Event Listeners para Período
      dom.periodButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          dom.periodButtons.forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-selected', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          currentPeriod = btn.dataset.period;
          renderAulas();
        });
      });

      // Event Listeners para Busca
      dom.searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        if (searchQuery.trim().length > 0) {
          dom.searchClearBtn.style.display = 'block';
        } else {
          dom.searchClearBtn.style.display = 'none';
        }
        renderAulas();
      });

      dom.searchClearBtn.addEventListener('click', () => {
        dom.searchInput.value = '';
        searchQuery = '';
        dom.searchClearBtn.style.display = 'none';
        dom.searchInput.focus();
        renderAulas();
      });

      window.addEventListener('load', () => {
        updateCounts();
        renderSubtabsBar();
        renderAulas();
        sendResizeMessage();
        setTimeout(sendResizeMessage, 300);
        setTimeout(sendResizeMessage, 1200);
        setTimeout(sendResizeMessage, 3000);
      });

      window.addEventListener('resize', sendResizeMessage);

      if ('ResizeObserver' in window) {
        const ro = new ResizeObserver(sendResizeMessage);
        ro.observe(document.body);
      }
    })();
  </script>
</body>
</html>
