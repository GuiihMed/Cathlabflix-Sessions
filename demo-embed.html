<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cathlabflix Sessions - Demonstração do Embed</title>

  <!-- Tipografia Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      /* Exemplo de fundo azul do seu site */
      background-color: #040d2d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* Contêiner da área central do seu site */
    .site-container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
    }

    /* Iframe Responsivo do Cathlabflix Sessions */
    .cathlabflix-iframe {
      width: 100%;
      max-width: 980px;
      height: 750px;
      border: none;
      display: block;
      margin: 0 auto;
      background: transparent;
      overflow: hidden;
      transition: height 0.25s ease-out;
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       Área Central do Seu Site (980px)
       ========================================================================== -->
  <div class="site-container">

    <!-- Iframe com Fundo 100% Transparente e Auto-Ajuste de Altura -->
    <iframe 
      id="cathlabflix-frame"
      class="cathlabflix-iframe"
      src="https://cathlabflix-sessions.vercel.app" 
      title="Cathlabflix Sessions"
      scrolling="no"
      frameborder="0"
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media" 
      allowtransparency="true"
    ></iframe>

  </div>

  <!-- Script que redimensiona a altura do Iframe dinamicamente sem rolagem dupla -->
  <script>
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'cathlabflix-sessions-resize') {
        var frame = document.getElementById('cathlabflix-frame');
        if (frame && event.data.height) {
          frame.style.height = event.data.height + 'px';
        }
      }
    });
  </script>

</body>
</html>
