<!DOCTYPE html>
<html lang="pt-BR" data-theme="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Cobertura Oficial TCT Plus Latam Valves 2026 - CathlabFlix</title>

  <link rel="apple-touch-icon" href="https://cathlabflix-sessions.vercel.app/assets/images/favicon.png">

  <!-- Open Graph / Redes Sociais -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.cathlabflix.org/tct-cobertura">
  <meta property="og:title" content="Cobertura Oficial TCT Plus Latam Valves 2026 - CathlabFlix">
  <meta property="og:description" content="Destaques, entrevistas exclusivas e depoimentos oficiais do CRF TCT Plus Latam Valves 2026.">

  <!-- Tipografia Montserrat Oficial SBHCI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root, [data-theme="blue"] {
      --color-bg-base: #010234;
      --color-surface: #062257;
      --color-surface-hover: #082b6e;
      --color-surface-elevated: #0a2d72;
      --color-text-primary: #FFFFFF;
      --color-text-secondary: #94a3b8;
      --color-text-tertiary: #64748b;
      --color-primary: #E50914;
      --color-primary-hover: #B80710;
      --color-blue-accent: #38bdf8;
      --color-blue-accent-glow: rgba(56, 189, 248, 0.35);
      --color-border-subtle: rgba(255, 255, 255, 0.12);
      --color-border-strong: rgba(255, 255, 255, 0.22);
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-pill: 9999px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
      --shadow-card: 0 8px 24px rgba(0, 0, 0, 0.35);
      --font-family-base: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-base: 0.25s ease;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: var(--color-bg-base) !important;
      color: var(--color-text-primary) !important;
      font-family: var(--font-family-base) !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden !important;
    }

    .app-container {
      min-height: 100vh;
      background-color: var(--color-bg-base);
      display: flex;
      flex-direction: column;
    }

    .cobertura-main {
      width: 96%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 12px 60px;
      box-sizing: border-box;
      flex: 1;
    }

    /* Top Bar */
    .top-nav-bar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 20px;
    }

    .back-solaci-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--color-surface);
      border: 1px solid var(--color-border-subtle);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      text-decoration: none;
      transition: all var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }

    .back-solaci-btn:hover {
      background: var(--color-surface-hover);
      border-color: rgba(56, 189, 248, 0.5);
      color: var(--color-blue-accent);
      transform: translateX(-3px);
    }

    /* Cabeçalho */
    .section-title-wrap {
      margin-bottom: 28px;
    }

    .page-title {
      font-size: clamp(1.4rem, 2.8vw, 2rem);
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin: 0 0 8px 0;
    }

    .page-title-underline {
      width: 50px;
      height: 3px;
      background: var(--color-primary, #E50914);
      border-radius: 2px;
      margin-top: 8px;
      margin-bottom: 14px;
    }

    .page-subtitle {
      font-size: clamp(0.85rem, 1.4vw, 0.95rem);
      color: var(--color-text-secondary);
      font-weight: 400;
      line-height: 1.55;
      max-width: 800px;
      margin: 0;
    }

    /* Barra de Filtros e Busca */
    .filters-bar {
      background: var(--color-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-sm);
    }

    .category-tabs-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cat-tab-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--color-border-subtle);
      color: #FFFFFF;
      padding: 9px 18px;
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 0.8125rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }

    .cat-tab-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .cat-tab-btn.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(229, 9, 20, 0.35);
    }

    .cat-tab-count {
      font-size: 0.6875rem;
      padding: 1px 6px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.15);
    }

    /* Campo de Busca */
    .search-input-box {
      position: relative;
      min-width: 240px;
      flex: 1;
      max-width: 340px;
    }

    .search-input-box input {
      width: 100%;
      background: rgba(1, 2, 52, 0.6);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-pill);
      padding: 9px 36px 9px 16px;
      color: #FFFFFF;
      font-family: inherit;
      font-size: 0.8125rem;
      outline: none;
      transition: all var(--transition-fast);
    }

    .search-input-box input:focus {
      border-color: var(--color-blue-accent);
      background: rgba(1, 2, 52, 0.9);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .search-input-box input::placeholder {
      color: var(--color-text-tertiary);
    }

    .search-input-box svg {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--color-text-tertiary);
      pointer-events: none;
    }

    /* Grid de Cobertura */
    .cobertura-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 40px;
    }

    /* Card Genérico de Cobertura */
    .cobertura-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow-card);
      transition: all var(--transition-base);
      position: relative;
      overflow: hidden;
    }

    .cobertura-card:hover {
      transform: translateY(-6px);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.7), 0 0 24px rgba(56, 189, 248, 0.18);
    }

    .card-top-tag-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-type-tag {
      font-size: 0.6875rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
    }

    .tag-highlight {
      background: rgba(56, 189, 248, 0.18);
      color: var(--color-blue-accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .tag-interview {
      background: rgba(229, 9, 20, 0.2);
      color: #ff6b6b;
      border: 1px solid rgba(229, 9, 20, 0.35);
    }

    .tag-testimonial {
      background: rgba(251, 191, 36, 0.18);
      color: #FBBF24;
      border: 1px solid rgba(251, 191, 36, 0.35);
    }

    .cobertura-card-title {
      font-size: 1.0625rem;
      font-weight: 800;
      color: #FFFFFF;
      line-height: 1.35;
      margin: 0;
    }

    .cobertura-card-desc {
      font-size: 0.84375rem;
      color: var(--color-text-secondary);
      line-height: 1.55;
      margin: 0;
      flex: 1;
    }

    /* Bloco Específico de Depoimento */
    .testimonial-quote-wrap {
      position: relative;
      padding-left: 14px;
      border-left: 3px solid #FBBF24;
      margin: 4px 0;
    }

    .testimonial-quote-text {
      font-size: 0.875rem;
      font-style: italic;
      color: rgba(255, 255, 255, 0.95);
      line-height: 1.55;
    }

    .author-info-block {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .author-avatar-badge {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #09132c 0%, #062257 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.875rem;
      font-weight: 800;
      color: var(--color-blue-accent);
      flex-shrink: 0;
    }

    .author-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .author-name {
      font-size: 0.875rem;
      font-weight: 700;
      color: #FFFFFF;
    }

    .author-role {
      font-size: 0.75rem;
      color: var(--color-text-secondary);
    }

    /* Entrevista Bloco */
    .interview-topic-block {
      background: rgba(1, 2, 52, 0.45);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .interview-topic-label {
      font-size: 0.6875rem;
      font-weight: 700;
      color: #ff6b6b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 4px;
    }

    .interview-topic-text {
      font-size: 0.8125rem;
      color: var(--color-text-secondary);
      line-height: 1.45;
      margin: 0;
    }

    /* Empty state */
    .cobertura-empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      color: var(--color-text-secondary);
      font-size: 0.9375rem;
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border-subtle);
    }

    /* Responsividade */
    @media (max-width: 992px) {
      .cobertura-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .filters-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .category-tabs-group {
        width: 100%;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .search-input-box {
        max-width: 100%;
      }
    }

    @media (max-width: 640px) {
      .cobertura-main {
        padding: 16px 12px 40px !important;
      }
      .cobertura-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .cobertura-card {
        padding: 18px;
      }
      .cat-tab-btn {
        padding: 8px 14px;
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <main class="cobertura-main" id="coberturaMainContent">

      <!-- Botão Voltar ao TCT Plus -->
      <nav class="top-nav-bar" aria-label="Navegação secundária">
        <a href="https://www.cathlabflix.org/tct" class="back-solaci-btn" target="_top" title="Voltar ao portal TCT Plus Latam Valves 2026">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

          <button type="button" class="cat-tab-btn" data-category="entrevistas" role="tab" aria-selected="false">

          <button type="button" class="cat-tab-btn" data-category="depoimentos" role="tab" aria-selected="false">

          >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
      </section>

      <!-- Grid com os Cards de Cobertura -->
      <section class="cobertura-grid" id="coberturaGrid" aria-label="Grade de conteúdos da cobertura">
        <!-- Injetado dinamicamente via JS -->
      </section>

    </main>
  </div>

  <script>
    (function () {
      'use strict';

      const COBERTURA_RAW = {
  "highlights": [
    {
      "title": "Heart Team & Casos Ao Vivo Internacionais",
      "desc": "Transmissões de procedimentos complexos em tempo real diretamente do InCor, Dante Pazzanese, Clínica Alemana (Santiago) e Piedmont Heart Institute (Atlanta), demonstrando abordagens de TAVI, ViV e reparo mitral/tricúspide.",
      "tag": "Casos Ao Vivo"
    },
    {
      "title": "Debates Globais sobre Durabilidade de Próteses Transcateter",
      "desc": "Painéis aprofundados com Dr. Nicolas Van Mieghem, Dr. Pedro Villablanca e lideranças da SBHCI debatendo degeneração valvar, Redo TAVI e estratégias de preservação coronariana.",
      "tag": "TAVI & Valvar"
    },
    {
      "title": "Inovação e Terapias Borda a Borda (TEER)",
      "desc": "Apresentação de novos dispositivos e técnicas de imagem multimodal ecocardiográfica 3D/ICE para tratamento percutâneo da insuficiência mitral e tricúspide com Dr. Rebecca Hahn e Dr. Susheel Kodali.",
      "tag": "Estrutural Mitral & Tricúspide"
    }
  ],
  "testimonials": [
    {
      "author": "Dr. Nicolas Van Mieghem",
      "role": "Erasmus MC, Roterdã",
      "quote": "O TCT Plus Latam Valves consolidou um nível científico e de discussão técnica comparável aos maiores fóruns mundiais da cardiologia estrutural."
    },
    {
      "author": "Dra. Rebecca Hahn",
      "role": "Columbia University / CRF",
      "quote": "A integração entre a imagem multimodal e o intervencionismo na América Latina está em um patamar de excelência impressionante."
    },
    {
      "author": "Dr. José Airton de Arruda",
      "role": "SBHCI / Coordenação Científica",
      "quote": "Uma edição histórica reunindo centenas de intervencionistas com compartilhamento de casos reais e aprendizado prático de alto impacto."
    }
  ],
  "interviews": [
    {
      "title": "Entrevista Especial: O Futuro da Intervenção Tricúspide",
      "interviewee": "Dr. Juan F. Granada (CRF / Nova York)",
      "topic": "Avanços em substituição ortotópica e novos ensaios clínicos globais."
    },
    {
      "title": "Entrevista Especial: Desafios Anatômicos em Redo TAVI",
      "interviewee": "Dr. Pedro Villablanca (Henry Ford Health)",
      "topic": "Planejamento tomográfico, prevenção de obstrução de óstios coronários e seleção de valvas."
    },
    {
      "title": "Entrevista Especial: Inteligência Artificial e Doenças Estruturais",
      "interviewee": "Dr. Henrique Ribeiro (InCor / HCor)",
      "topic": "Como ferramentas de IA auxiliam no dimensionamento pré-operatório e desfechos clínicos."
    }
  ]
};

      // Normalizar itens em formato unificado
      const ALL_ITEMS = [];

      (COBERTURA_RAW.highlights || []).forEach((h, i) => {
        ALL_ITEMS.push({
          id: 'highlight-' + (i + 1),
          type: 'destaques',
          typeLabel: 'Destaque Científico',
          tag: h.tag || 'Casos Ao Vivo',
          tagClass: 'tag-highlight',
          title: h.title,
          desc: h.desc,
          badgeText: 'DESTAQUE',
          author: null,
          role: null,
          quote: null,
          interviewee: null,
          topic: null
        });
      });

      (COBERTURA_RAW.interviews || []).forEach((it, i) => {
        ALL_ITEMS.push({
          id: 'interview-' + (i + 1),
          type: 'entrevistas',
          typeLabel: 'Entrevista Especial',
          tag: 'Entrevista',
          tagClass: 'tag-interview',
          title: it.title,
          interviewee: it.interviewee,
          topic: it.topic,
          badgeText: 'ENTREVISTA',
          desc: it.topic,
          author: it.interviewee,
          role: 'Especialista Convidado',
          quote: null
        });
      });

      (COBERTURA_RAW.testimonials || []).forEach((t, i) => {
        ALL_ITEMS.push({
          id: 'testimonial-' + (i + 1),
          type: 'depoimentos',
          typeLabel: 'Depoimento da Liderança',
          tag: 'Liderança TCT',
          tagClass: 'tag-testimonial',
          title: t.author,
          author: t.author,
          role: t.role,
          quote: t.quote,
          badgeText: 'DEPOIMENTO',
          desc: t.quote,
          interviewee: null,
          topic: null
        });
      });

      let currentCategory = 'all';
      let searchQuery = '';

      const dom = {
        grid: document.getElementById('coberturaGrid'),
        buttons: document.querySelectorAll('.cat-tab-btn'),
        searchInput: document.getElementById('searchInput')
      };

      function sendResizeMessage() {
        try {
          const height = Math.max(
            document.body.scrollHeight || 0,
            document.documentElement.scrollHeight || 0,
            document.body.offsetHeight || 0
          );
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'setHeight', height: height + 35 }, '*');
            window.parent.postMessage({ type: 'cathlabflix-sessions-resize', height: height + 35 }, '*');
          }
        } catch (e) {}
      }

      function escapeHTML(str) {
        if (!str) return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getInitials(name) {
        if (!name) return 'TC';
        const clean = name.replace(/Dr\.?|Dra\.?/gi, '').trim();
        const parts = clean.split(/\s+/);
        if (parts.length >= 2) {
          return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }
        return clean.substring(0, 2).toUpperCase();
      }

      function createCardHTML(item) {
        if (item.type === 'depoimentos') {
          return `
            <article class="cobertura-card" data-type="depoimentos">
              <div class="card-top-tag-row">
                <span class="card-type-tag ${item.tagClass}">${escapeHTML(item.badgeText)}</span>
                <span style="font-size: 0.6875rem; color: #FBBF24; font-weight: 700;">★ DEPOIMENTO OFICIAL</span>
              </div>
              <div class="testimonial-quote-wrap">
                <p class="testimonial-quote-text">"${escapeHTML(item.quote)}"</p>
              </div>
              <div class="author-info-block">
                <div class="author-avatar-badge" style="border-color: rgba(251, 191, 36, 0.4); color: #FBBF24;">
                  ${getInitials(item.author)}
                </div>
                <div class="author-details">
                  <span class="author-name">${escapeHTML(item.author)}</span>
                  <span class="author-role">${escapeHTML(item.role)}</span>
                </div>
              </div>
            </article>
          `;
        }

        if (item.type === 'entrevistas') {
          return `
            <article class="cobertura-card" data-type="entrevistas">
              <div class="card-top-tag-row">
                <span class="card-type-tag ${item.tagClass}">${escapeHTML(item.badgeText)}</span>
                <span style="font-size: 0.6875rem; color: #ff6b6b; font-weight: 700;">LATAM & GLOBAL</span>
              </div>
              <h3 class="cobertura-card-title">${escapeHTML(item.title)}</h3>
              <div class="interview-topic-block">
                <span class="interview-topic-label">Tema em Debate:</span>
                <p class="interview-topic-text">${escapeHTML(item.topic)}</p>
              </div>
              <div class="author-info-block">
                <div class="author-avatar-badge" style="border-color: rgba(229, 9, 20, 0.4); color: #ff6b6b;">
                  ${getInitials(item.interviewee)}
                </div>
                <div class="author-details">
                  <span class="author-name">${escapeHTML(item.interviewee)}</span>
                  <span class="author-role">Entrevista Oficial TCT Plus</span>
                </div>
              </div>
            </article>
          `;
        }

        // Destaques
        return `
          <article class="cobertura-card" data-type="destaques">
            <div class="card-top-tag-row">
              <span class="card-type-tag ${item.tagClass}">${escapeHTML(item.tag)}</span>
              <span style="font-size: 0.6875rem; color: var(--color-blue-accent); font-weight: 700;">DESTAQUE</span>
            </div>
            <h3 class="cobertura-card-title">${escapeHTML(item.title)}</h3>
            <p class="cobertura-card-desc">${escapeHTML(item.desc)}</p>
            <div class="author-info-block">
              <div class="author-avatar-badge">TCT</div>
              <div class="author-details">
                <span class="author-name">TCT Plus Latam Valves 2026</span>
                <span class="author-role">Cobertura & Inovação Científica</span>
              </div>
            </div>
          </article>
        `;
      }

      function renderGrid() {
        const q = searchQuery.toLowerCase().trim();

        const filtered = ALL_ITEMS.filter(item => {
          if (currentCategory !== 'all' && item.type !== currentCategory) {
            return false;
          }
          if (q.length > 0) {
            const matchTitle = (item.title || '').toLowerCase().includes(q);
            const matchDesc = (item.desc || '').toLowerCase().includes(q);
            const matchAuthor = (item.author || '').toLowerCase().includes(q);
            const matchRole = (item.role || '').toLowerCase().includes(q);
            const matchTopic = (item.topic || '').toLowerCase().includes(q);
            if (!matchTitle && !matchDesc && !matchAuthor && !matchRole && !matchTopic) {
              return false;
            }
          }
          return true;
        });

        if (filtered.length === 0) {
          dom.grid.innerHTML = `
            <div class="cobertura-empty-state">
              <p>Nenhum conteúdo encontrado na cobertura para a busca realizada.</p>
            </div>
          `;
        } else {
          dom.grid.innerHTML = filtered.map(item => createCardHTML(item)).join('');
        }

        sendResizeMessage();
      }

      // Event listeners
      dom.buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          dom.buttons.forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-selected', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          currentCategory = btn.dataset.category;
          renderGrid();
        });
      });

      dom.searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderGrid();
      });

      window.addEventListener('load', () => {
        renderGrid();
        sendResizeMessage();
        setTimeout(sendResizeMessage, 300);
        setTimeout(sendResizeMessage, 1200);
        setTimeout(sendResizeMessage, 3000);
      });

      window.addEventListener('resize', sendResizeMessage);

      if ('ResizeObserver' in window) {
        const ro = new ResizeObserver(sendResizeMessage);
        ro.observe(document.body);
      }
    })();
  </script>
</body>
</html>
