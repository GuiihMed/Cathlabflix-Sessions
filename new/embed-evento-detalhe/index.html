    :root {
      --color-bg-base: #010234;
      --color-surface: #062257;
      --color-surface-elevated: #082b6e;
      --color-surface-hover: #0c3685;
      --color-border-subtle: rgba(255, 255, 255, 0.12);
      --color-text-primary: #FFFFFF;
      --color-text-secondary: #94a3b8;
      --color-text-tertiary: #64748b;
      --color-primary: #E50914;
      --color-primary-hover: #B80710;
      --color-blue-accent: #38bdf8;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 9999px;
      --font-family-base: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: var(--color-bg-base) !important;
      color: var(--color-text-primary) !important;
      font-family: var(--font-family-base) !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden !important;
    }

    .event-embed-container {
      width: 94%;
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 8px 60px;
    }

    @media (max-width: 768px) {
      .event-embed-container {
        width: 100% !important;
        max-width: 100% !important;
        padding: 14px 12px 40px !important;
      }
    }

    /* Barra Superior de Navegação */
    .event-nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--color-border-subtle);
      flex-wrap: wrap;
      gap: 12px;
    }

    .event-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--color-surface);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border-subtle);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-size: 0.8125rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .event-back-btn:hover {
      background: var(--color-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
      transform: translateX(-2px);
    }

    .event-type-chip {
      font-size: 0.6875rem;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
    }

    .badge-oficial {
      background: #E50914;
      color: #fff;
    }

    .badge-apoio {
      background: #0284c7;
      color: #fff;
    }

    .badge-eventos {
      background: #7c3aed;
      color: #fff;
    }

    /* Banner Hero 16:9 Widescreen */
    .event-hero-banner {
      width: 100%;
      aspect-ratio: 16 / 9;
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #020b24;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      margin-bottom: 24px;
    }

    .event-hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .event-hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(1, 2, 52, 0) 40%, rgba(1, 2, 52, 0.85) 100%);
      pointer-events: none;
    }

    /* Conteúdo Principal do Artigo do Evento */
    .event-article-body {
      background: var(--color-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    @media (max-width: 600px) {
      .event-article-body {
        padding: 20px 16px;
      }
    }

    .event-header-section {
      margin-bottom: 24px;
    }

    .event-main-title {
      font-size: 1.45rem;
      font-weight: 900;
      line-height: 1.25;
      color: #fff;
      margin: 0 0 8px 0;
      letter-spacing: -0.02em;
    }

    @media (max-width: 600px) {
      .event-main-title {
        font-size: 1.22rem;
      }
    }

    .event-lead-subtitle {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--color-text-secondary);
      line-height: 1.5;
      margin: 0;
    }

    /* Grid de Informações Chave (Data, Horário, Local) */
    .event-info-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    @media (max-width: 768px) {
      .event-info-cards-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }

    .event-info-card {
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .info-card-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

      background: rgba(229, 9, 20, 0.15);
      color: var(--color-primary);
    }

    .info-card-icon.blue {
      background: rgba(56, 189, 248, 0.15);
      color: var(--color-blue-accent);
    }

    .info-card-icon.amber {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
    }

    .info-card-text {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .info-card-label {
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-text-secondary);
      margin-bottom: 2px;
    }

    .info-card-val {
      font-size: 0.875rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-action-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 0;
      margin-bottom: 28px;
      border-top: 1px solid var(--color-border-subtle);
      border-bottom: 1px solid var(--color-border-subtle);
      flex-wrap: wrap;
    }

      color: #fff;
      font-size: 0.875rem;
      font-weight: 800;
      padding: 12px 24px;
      border-radius: var(--radius-pill);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(229, 9, 20, 0.4);
      transition: all var(--transition-fast);

      background: linear-gradient(135deg, #f01420, #E50914);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(229, 9, 20, 0.55);
    }

    .agenda-export-dropdown-wrapper {
      position: relative;
    }

    .btn-save-calendar {
      background: var(--color-surface-elevated);
      color: #fff;
      border: 1px solid var(--color-border-subtle);
      font-size: 0.8125rem;
      font-weight: 700;
      padding: 11px 20px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all var(--transition-fast);
    }

    .btn-save-calendar:hover {
      background: var(--color-surface-hover);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .agenda-export-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: #041844;
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      width: 210px;
      display: none;
      flex-direction: column;
      z-index: 50;
      overflow: hidden;
      animation: fadeIn 0.15s ease-out;
    }

    .agenda-export-menu.is-open {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .export-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      color: var(--color-text-primary);
      text-decoration: none;
      font-size: 0.8125rem;
      font-weight: 600;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .export-menu-item:hover {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }

    /* Seção Sobre o Evento */

      margin-top: 10px;
    }

      font-weight: 800;
      color: #fff;
      margin: 0 0 14px 0;
      letter-spacing: -0.01em;

      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 28px;

      color: var(--color-primary);

      font-weight: 800;
      color: #fff;
      margin: 0 0 4px 0;
    }

    .institution-text p {
      font-size: 0.75rem;
      color: var(--color-text-secondary);
      margin: 0;
      line-height: 1.45;
    }

      padding: 60px 20px;
      text-align: center;
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border-subtle);
    }
  </style>
</head>

  <script>
/**
 * CathlabFlix Events Service
 * Gerenciamento centralizado de eventos, persistência local, integração automática com Wix CMS / API e exportação de calendários (.ics / Google)
 */

(function(global) {
  'use strict';

  const STORAGE_KEY = 'cathlabflix_custom_events';
  const API_ENDPOINT = '/api/wix-events';

  const EventsService = {
    /**
     * Retorna todos os eventos combinando os eventos oficiais com os cadastrados via painel/Wix
     */
    getAllEvents() {
      let baseList = [];
      if (typeof window !== 'undefined' && Array.isArray(window.INITIAL_EVENTS)) {
        baseList = window.INITIAL_EVENTS.slice();
      } else if (typeof INITIAL_EVENTS !== 'undefined' && Array.isArray(INITIAL_EVENTS)) {
        baseList = INITIAL_EVENTS.slice();
      }

      let customList = [];
      try {
        if (typeof localStorage !== 'undefined') {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            customList = JSON.parse(stored);
          }
        }
      } catch (e) {
        console.warn('[EventsService] Erro ao ler eventos customizados:', e);
      }

      // Mescla substituindo por ID se já existir ou adicionando novos no topo
      const map = new Map();
      baseList.forEach(ev => map.set(ev.id, ev));
      customList.forEach(ev => map.set(ev.id, ev));

      const merged = Array.from(map.values());
      return merged.sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime());
    },

    /**
     * Busca um evento específico por ID ou slug
     */
    getEventById(id) {
      if (!id) return null;
      const cleanId = String(id).trim().toLowerCase();
      const all = this.getAllEvents();
      return all.find(ev => (ev.id && ev.id.toLowerCase() === cleanId) || (ev.slug && ev.slug.toLowerCase() === cleanId)) || null;
    },

    /**
     * Sincroniza eventos remotos da API / Wix CMS
     */
    async syncFromRemote() {
      try {
        const res = await fetch(API_ENDPOINT);
        if (!res.ok) return null;
        const data = await res.json();
        if (data && data.success && Array.isArray(data.items)) {
          // Atualiza lista em memória se aplicável
          if (typeof window !== 'undefined') {
            window.dispatchEvent(new CustomEvent('cathlabflix:remote-events-loaded', { detail: data.items }));
          }
          return data.items;
        }
      } catch (e) {
        console.warn('[EventsService] Não foi possível sincronizar da API remota:', e);
      }
      return null;
    },

    /**
     * Salva ou atualiza um evento no banco local (localStorage) e dispara envio automático para a API/Wix CMS
     */
    saveEvent(eventData) {
      if (!eventData || !eventData.title || !eventData.date) {
        throw new Error('Título e Data são campos obrigatórios para o evento.');
      }

      const id = eventData.id || this.slugify(eventData.title) + '-' + Date.now().toString(36);
      
      // Regra de replicação de data de início caso término esteja vazio
      const startDate = eventData.date.trim();
      const finalEndDate = eventData.endDate && eventData.endDate.trim() !== '' ? eventData.endDate.trim() : startDate;

      // Mapeamento dos 3 tipos
      const typeRaw = (eventData.type || 'evento').toLowerCase();
      let finalType = 'evento';
      let finalBadge = 'EVENTO OFICIAL SBHCI';
      let finalColor = 'red';

      if (typeRaw.includes('apoio')) {
        finalType = 'apoio_sbhci';
        finalBadge = 'APOIO SBHCI';
        finalColor = 'blue';
      } else if (typeRaw === 'eventos' || typeRaw === 'evento_geral') {
        finalType = 'eventos';
        finalBadge = 'EVENTOS';
        finalColor = 'blue';
      }

      const regUrl = eventData.registrationUrl ? eventData.registrationUrl.trim() : '';

      const normalized = {
        id: id,
        slug: id,
        title: eventData.title.trim(),
        subtitle: (eventData.subtitle || eventData.description || '').substring(0, 160),
        description: eventData.description || eventData.subtitle || '',
        date: startDate,
        endDate: finalEndDate,
        time: eventData.time ? eventData.time.trim() : 'Horário a definir',
        location: eventData.location ? eventData.location.trim() : 'Plataforma CathlabFlix Streaming',
        modality: eventData.modality || (eventData.location && eventData.location.toLowerCase().includes('wtc') ? 'Presencial e On-line' : 'Transmissão Online'),
        type: finalType,
        badge: finalBadge,
        category: eventData.category || (finalType === 'apoio_sbhci' ? 'Apoio SBHCI' : (finalType === 'eventos' ? 'Eventos' : 'Congresso')),
        color: finalColor,
        image: eventData.image || 'https://static.wixstatic.com/media/1d3d47_ea12f71c1a89466e8ce53ce73939e79d~mv2.png/v1/fill/w_3000,h_662,al_c,q_95,enc_avif,quality_auto/1d3d47_ea12f71c1a89466e8ce53ce73939e79d~mv2.png',
        registrationUrl: regUrl,
        actionUrl: regUrl || `/new/evento?id=${encodeURIComponent(id)}`,
        actionLabel: 'Confira'
      };

      try {
        if (typeof localStorage !== 'undefined') {
          let customList = [];
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) customList = JSON.parse(stored);

          const existingIdx = customList.findIndex(e => e.id === normalized.id);
          if (existingIdx >= 0) {
            customList[existingIdx] = normalized;
          } else {
            customList.push(normalized);
          }

          localStorage.setItem(STORAGE_KEY, JSON.stringify(customList));
        }

        // Dispara evento global para re-renderizar instâncias ativas do calendário
        if (typeof window !== 'undefined') {
          window.dispatchEvent(new CustomEvent('cathlabflix:events-updated', { detail: normalized }));
        }

        // Sincronização automática em background com a API do Wix CMS
        if (typeof fetch !== 'undefined') {
          fetch(API_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(normalized)
          }).then(res => res.json()).then(resData => {
            console.log('[EventsService] Evento sincronizado com a API:', resData);
          }).catch(err => {
            console.warn('[EventsService] Não foi possível sincronizar com o backend remoto agora (salvo localmente):', err);
          });
        }

        return normalized;
      } catch (err) {
        console.error('[EventsService] Falha ao persistir evento:', err);
        throw err;
      }
    },

    /**
     * Remove um evento personalizado do banco local
     */
    deleteEvent(id) {
      try {
        if (typeof localStorage !== 'undefined') {
          let customList = [];
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) customList = JSON.parse(stored);

          const filtered = customList.filter(e => e.id !== id);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered));
        }

        if (typeof window !== 'undefined') {
          window.dispatchEvent(new CustomEvent('cathlabflix:events-updated', { detail: { id, deleted: true } }));
        }
        return true;
      } catch (err) {
        console.error('[EventsService] Falha ao excluir evento:', err);
        return false;
      }
    },

    /**
     * Retorna os eventos formatados para importação em Coleção de Dados do Wix (Wix Data Collection / CMS)
     */
    exportWixCollectionJSON() {
      const events = this.getAllEvents();
      return events.map(ev => ({
        _id: ev.id,
        title: ev.title,
        subtitle: ev.subtitle,
        description: ev.description,
        date: ev.date,
        endDate: ev.endDate || ev.date,
        time: ev.time,
        location: ev.location,
        modality: ev.modality,
        type: ev.type === 'apoio_sbhci' ? 'Apoio SBHCI' : (ev.type === 'eventos' ? 'Eventos' : 'Evento Oficial SBHCI'),
        badge: ev.badge,
        image: ev.image,
        registrationUrl: ev.registrationUrl || '',
        slug: ev.slug || ev.id
      }));
    },

    /**
     * Código Velo Backend para http-functions.js no Wix
     */
    generateWixVeloSnippet() {
      return `// Wix Velo Backend (http-functions.js)
// Coleção: "Eventos"
import { ok, created, serverError } from 'wix-http-functions';
import wixData from 'wix-data';

// GET https://SEU-SITE-WIX/_functions/eventos
export function get_eventos(request) {
  const options = {
    headers: {
      'Content-Type': 'application/json',
      'Access-Control-Allow-Origin': '*'
    }
  };

  return wixData.query('Eventos')
    .ascending('date')
    .find()
    .then(results => {
      options.body = {
        success: true,
        items: results.items
      };
      return ok(options);
    })
    .catch(error => {
      options.body = { success: false, error: error.message };
      return serverError(options);
    });
}

// POST https://SEU-SITE-WIX/_functions/eventos
export function post_eventos(request) {
  const options = {
    headers: {
      'Content-Type': 'application/json',
      'Access-Control-Allow-Origin': '*'
    }
  };

  return request.body.json()
    .then(body => {
      return wixData.insert('Eventos', body);
    })
    .then(result => {
      options.body = { success: true, item: result };
      return created(options);
    })
    .catch(error => {
      options.body = { success: false, error: error.message };
      return serverError(options);
    });
}`;
    },

    /**
     * Cria slug amigável a partir do título
     */
    slugify(str) {
      return String(str || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    },

    /**
     * Gera URL de adição para o Google Calendar
     */
    generateGoogleCalendarUrl(event) {
      if (!event) return '#';
      const title = encodeURIComponent(event.title || 'Evento CathlabFlix');
      const details = encodeURIComponent((event.description || event.subtitle || '') + '\n\nMais informações: ' + (event.registrationUrl || 'https://cathlabflix-sessions.vercel.app'));
      const location = encodeURIComponent(event.location || 'CathlabFlix Streaming');

      const dateClean = (event.date || '').replace(/-/g, '');
      const endDateClean = (event.endDate || event.date || '').replace(/-/g, '');
      const startHour = (event.startTime || '09:00').replace(':', '');
      const endHour = (event.endTime || '18:00').replace(':', '');

      const startIso = `${dateClean}T${startHour}00Z`;
      const endIso = `${endDateClean}T${endHour}00Z`;

      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}&location=${location}&dates=${startIso}/${endIso}`;
    },

    /**
     * Gera e dispara download do arquivo .ics (Apple Agenda, Outlook, etc.)
     */
    downloadIcs(event, fileName) {
      if (!event) return;
      const dateClean = (event.date || '').replace(/-/g, '');
      const endDateClean = (event.endDate || event.date || '').replace(/-/g, '');
      const startHour = (event.startTime || '09:00').replace(':', '');
      const endHour = (event.endTime || '18:00').replace(':', '');

      const dtStart = `${dateClean}T${startHour}00`;
      const dtEnd = `${endDateClean}T${endHour}00`;
      const now = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

      const icsContent = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//CathlabFlix SBHCI//Agenda Oficial//PT',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        'BEGIN:VEVENT',
        `UID:${event.id || 'event'}-${dateClean}@cathlabflix.org`,
        `DTSTAMP:${now}`,
        `DTSTART:${dtStart}`,
        `DTEND:${dtEnd}`,
        `SUMMARY:${event.title}`,
        `DESCRIPTION:${(event.description || event.subtitle || '').replace(/\n/g, '\\n')}`,
        `LOCATION:${event.location || 'CathlabFlix Streaming'}`,
        'STATUS:CONFIRMED',
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName || `${event.id || 'evento-cathlabflix'}.ics`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }
  };

  // Exportação para escopo global e módulos
  global.EventsService = EventsService;

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = EventsService;
  }
})(typeof window !== 'undefined' ? window : globalThis);

              </div>
            </div>

            <div class="event-info-card">
              <div class="info-card-icon amber">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
              </div>
              <div class="info-card-text">
                <span class="info-card-label">Local</span>
                <span class="info-card-val">${escapeHTML(event.location || 'Plataforma CathlabFlix Streaming')}</span>
              </div>
            </div>
          </section>

          <!-- Barra de Ações -->
          <section class="event-action-bar">
            <!-- BOTÃO DE INSCRIÇÃO CONDICIONAL: se não houver link, não exibe nada -->
            ${hasRegistrationUrl ? `
              <a href="${escapeHTML(event.registrationUrl)}" class="btn-registration-cta" target="_blank" rel="noopener noreferrer">
                <span>Inscrição no Site</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </a>
            ` : ''}

            <!-- Menu Salvar na Agenda -->
            <div class="agenda-export-dropdown-wrapper">
              <button type="button" class="btn-save-calendar" id="saveCalendarBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>Salvar na Agenda</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>

              <div class="agenda-export-menu" id="calendarMenu">
                <a href="${googleCalUrl}" target="_blank" rel="noopener noreferrer" class="export-menu-item">
                  <span style="font-weight: 800; color: #4285F4;">G</span>
                  Google Calendar
                </a>
                <button type="button" class="export-menu-item" id="exportAppleBtn">
                  <span></span>
                  Apple Agenda (.ics)
                </button>
                <button type="button" class="export-menu-item" id="exportOutlookBtn">
                  <span style="color: #0078D4;">O</span>
                  Outlook (.ics)
                </button>
              </div>
            </div>
          </section>

          <!-- Seção de Descrição do Evento (Opcional) -->
          ${event.description ? `
            <section class="event-content-section">
              <h2 class="section-title">Sobre este Evento</h2>
              <div class="event-description-text">
                <p>${escapeHTML(event.description).replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>')}</p>
              </div>
            </section>
          ` : ''}
        </article>
      `;

      // Listener de Voltar
      const backBtn = document.getElementById('backBtn');
      if (backBtn) {
        backBtn.addEventListener('click', () => {
          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = '/embed-home.html';
          }
        });
      }

      // Listeners do Menu de Calendário
      const saveCalBtn = document.getElementById('saveCalendarBtn');
      const calMenu = document.getElementById('calendarMenu');

      if (saveCalBtn && calMenu) {
        saveCalBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          calMenu.classList.toggle('is-open');
        });

        document.addEventListener('click', (e) => {
          if (!e.target.closest('.agenda-export-dropdown-wrapper')) {
            calMenu.classList.remove('is-open');
          }
        });

        const appleBtn = document.getElementById('exportAppleBtn');
        if (appleBtn && typeof EventsService !== 'undefined' && typeof EventsService.downloadIcs === 'function') {
          appleBtn.addEventListener('click', () => {
            EventsService.downloadIcs(event, `${event.id}.ics`);
            calMenu.classList.remove('is-open');
          });
        }

        const outlookBtn = document.getElementById('exportOutlookBtn');
        if (outlookBtn && typeof EventsService !== 'undefined' && typeof EventsService.downloadIcs === 'function') {
          outlookBtn.addEventListener('click', () => {
            EventsService.downloadIcs(event, `${event.id}.ics`);
            calMenu.classList.remove('is-open');
          });
        }
      }
    }

    function renderNotFound(container, eventId) {
      container.innerHTML = `
        <div class="event-not-found-card">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--color-primary); margin-bottom: 16px;">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <h2 style="font-size: 1.25rem; font-weight: 800; margin: 0 0 8px 0;">Evento não localizado</h2>
          <p style="font-size: 0.875rem; color: var(--color-text-secondary); margin: 0 0 20px 0;">
            O evento solicitado ${eventId ? `(<code>${escapeHTML(eventId)}</code>)` : ''} não foi encontrado ou já foi encerrado.
          </p>
          <button type="button" class="event-back-btn" onclick="window.location.href='/embed-home.html'">
            <span>Ir para a Agenda</span>
          </button>
        </div>
      `;
    }

    function formatDateString(dateStr, endDateStr, dateRangeLabel) {
      if (dateRangeLabel) return dateRangeLabel;
      if (!dateStr) return 'Data a definir';

      const months = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
      const parts = dateStr.split('-');
      const year = parts[0];
      const month = months[parseInt(parts[1], 10) - 1];
      const day = parseInt(parts[2], 10);

      if (endDateStr && endDateStr !== dateStr) {
        const endParts = endDateStr.split('-');
        const endDay = parseInt(endParts[2], 10);
        const endMonth = months[parseInt(endParts[1], 10) - 1];
        if (parts[1] === endParts[1]) {
          return `${day} a ${endDay} de ${month} de ${year}`;
        }
        return `${day} de ${month} a ${endDay} de ${endMonth} de ${year}`;
      }

      return `${day} de ${month} de ${year}`;
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>

</body>
</html>
