      let currentPeriod = 'all';
      let searchQuery = '';
      const openAulaIds = new Set();

      const dom = {
        container: document.getElementById('aulasContainer'),
        periodButtons: document.querySelectorAll('.aulas-period-btn'),
        searchInput: document.getElementById('aulasSearchInput'),
        searchClearBtn: document.getElementById('aulasSearchClearBtn'),
        countAll: document.getElementById('countAllPeriod'),
        countManha: document.getElementById('countManhaPeriod'),
        countTarde: document.getElementById('countTardePeriod')
      };

      function sendResizeMessage() {
        try {
          const height = Math.max(
            document.body.scrollHeight || 0,
            document.documentElement.scrollHeight || 0,
            document.body.offsetHeight || 0
          );
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'setHeight', height: height + 35 }, '*');
            window.parent.postMessage({ type: 'cathlabflix-sessions-resize', height: height + 35 }, '*');
          }
        } catch (e) {}
      }

      function escapeHTML(str) {
        if (!str) return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getFilteredAulas() {
        return AULAS.filter(aula => {
          if (currentPeriod !== 'all' && aula.periodKey !== currentPeriod) {
            return false;
          }
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase().trim();
            const titleMatch = (aula.title || '').toLowerCase().includes(q);
            const speakerMatch = (aula.speaker || '').toLowerCase().includes(q);
            const timeMatch = (aula.time || '').toLowerCase().includes(q);
            if (!titleMatch && !speakerMatch && !timeMatch) return false;
          }
          return true;
        });
      }

      function createAulaItem(aula) {
        const isOpen = openAulaIds.has(aula.id);
        const item = document.createElement('div');
        item.className = 'aulas-accordion-item' + (isOpen ? ' open' : '');
        item.dataset.id = aula.id;

        item.innerHTML = `
          <button type="button" class="aulas-accordion-header" aria-expanded="${isOpen}">
            <div class="aulas-header-content">
              <div class="aulas-header-meta">
                <span class="aula-time-badge">${escapeHTML(aula.time)}</span>
                <span class="aula-period-tag">${escapeHTML(aula.period)}</span>
                <span class="aulas-item-speaker">${escapeHTML(aula.speaker)}</span>
              </div>
              <h3 class="aulas-item-title">${escapeHTML(aula.title)}</h3>
            </div>
            <span class="aulas-item-chevron">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </button>
          <div class="aulas-accordion-body">
            <div class="aulas-pptx-card">
              <div class="aulas-pptx-badge">PPTX</div>
              <div class="aulas-pptx-info">
                <span class="aulas-pptx-name">${escapeHTML(aula.file.name)}</span>
                <span class="aulas-pptx-meta">Apresentação Oficial • Tamanho: ${escapeHTML(aula.file.size)}</span>
              </div>
              <div class="aulas-pptx-actions">
                <a href="${escapeHTML(aula.file.downloadUrl)}" class="aulas-pptx-download-btn" title="Baixar material da aula" onclick="event.preventDefault(); alert('Material científico disponível para download oficial dos inscritos TCT Plus Latam Valves 2026.');">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                  </svg>
                  <span>Baixar Apresentação</span>
                </a>
              </div>
            </div>
          </div>
        `;

        const btn = item.querySelector('.aulas-accordion-header');
        btn.addEventListener('click', () => {
          if (openAulaIds.has(aula.id)) {
            openAulaIds.delete(aula.id);
            item.classList.remove('open');
            btn.setAttribute('aria-expanded', 'false');
          } else {
            openAulaIds.add(aula.id);
            item.classList.add('open');
            btn.setAttribute('aria-expanded', 'true');
          }
          sendResizeMessage();
        });

        return item;
      }

      function renderAulas() {
        const filtered = getFilteredAulas();
        dom.container.innerHTML = '';

        if (filtered.length === 0) {
          dom.container.innerHTML = `
            <div class="aulas-empty-state">
              <p>Nenhuma apresentação encontrada para os critérios selecionados.</p>
            </div>
          `;
          sendResizeMessage();
          return;
        }

        // Divide by period if 'all' is selected
        if (currentPeriod === 'all' && searchQuery.trim() === '') {
          const manhaList = filtered.filter(a => a.periodKey === 'manha');
          const tardeList = filtered.filter(a => a.periodKey === 'tarde');

          if (manhaList.length > 0) {
            const section = document.createElement('section');
            section.className = 'aulas-period-section';
            section.innerHTML = `
              <div class="aulas-period-header">
                <div class="aulas-period-header-left">
                  <div class="aulas-period-title-group">
                    <span class="aulas-period-icon-wrap sun">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                      </svg>
                    </span>
                    <h2 class="aulas-period-title">Manhã</h2>
                    <span class="aulas-period-range-tag">08:00 às 12:00</span>
                  </div>
                  <p class="aulas-period-desc">Conferências científicas e casos gravados do período matutino</p>
                </div>
                <span class="aulas-period-count-pill">${manhaList.length} apresentações</span>
              </div>
            `;
            const listWrapper = document.createElement('div');
            listWrapper.className = 'aulas-list-wrapper';
            manhaList.forEach(aula => listWrapper.appendChild(createAulaItem(aula)));
            section.appendChild(listWrapper);
            dom.container.appendChild(section);
          }

          if (tardeList.length > 0) {
            const section = document.createElement('section');
            section.className = 'aulas-period-section';
            section.innerHTML = `
              <div class="aulas-period-header">
                <div class="aulas-period-header-left">
                  <div class="aulas-period-title-group">
                    <span class="aulas-period-icon-wrap sunset">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M17 18a5 5 0 0 0-10 0"></path>
                        <line x1="12" y1="9" x2="12" y2="2"></line>
                        <line x1="4.22" y1="10.22" x2="5.64" y2="11.64"></line>
                        <line x1="1" y1="18" x2="3" y2="18"></line>
                        <line x1="21" y1="18" x2="23" y2="18"></line>
                        <line x1="18.36" y1="11.64" x2="19.78" y2="10.22"></line>
                        <line x1="23" y1="22" x2="1" y2="22"></line>
                      </svg>
                    </span>
                    <h2 class="aulas-period-title">Tarde / Noite</h2>
                    <span class="aulas-period-range-tag">12:00 às 23:30</span>
                  </div>
                  <p class="aulas-period-desc">Apresentações temáticas e discussões técnicas do período vespertino e noturno</p>
                </div>
                <span class="aulas-period-count-pill">${tardeList.length} apresentações</span>
              </div>
            `;
            const listWrapper = document.createElement('div');
            listWrapper.className = 'aulas-list-wrapper';
            tardeList.forEach(aula => listWrapper.appendChild(createAulaItem(aula)));
            section.appendChild(listWrapper);
            dom.container.appendChild(section);
          }
        } else {
          const listWrapper = document.createElement('div');
          listWrapper.className = 'aulas-list-wrapper';
          filtered.forEach(aula => listWrapper.appendChild(createAulaItem(aula)));
          dom.container.appendChild(listWrapper);
        }

        sendResizeMessage();
      }

      function updateCounts() {
        const manhaCount = AULAS.filter(a => a.periodKey === 'manha').length;
        const tardeCount = AULAS.filter(a => a.periodKey === 'tarde').length;
        if (dom.countAll) dom.countAll.textContent = AULAS.length;
        if (dom.countManha) dom.countManha.textContent = manhaCount;
        if (dom.countTarde) dom.countTarde.textContent = tardeCount;
      }

      // Event Listeners
      dom.periodButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          dom.periodButtons.forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-selected', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          currentPeriod = btn.dataset.period;
          renderAulas();
        });
      });

      dom.searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        if (searchQuery.trim().length > 0) {
          dom.searchClearBtn.style.display = 'block';
        } else {
          dom.searchClearBtn.style.display = 'none';
        }
        renderAulas();
      });

      dom.searchClearBtn.addEventListener('click', () => {
        dom.searchInput.value = '';
        searchQuery = '';
        dom.searchClearBtn.style.display = 'none';
        dom.searchInput.focus();
        renderAulas();
      });

      window.addEventListener('load', () => {
        updateCounts();
        renderAulas();
        sendResizeMessage();
        setTimeout(sendResizeMessage, 300);
        setTimeout(sendResizeMessage, 1200);
        setTimeout(sendResizeMessage, 3000);
      });

      window.addEventListener('resize', sendResizeMessage);

      if ('ResizeObserver' in window) {
        const ro = new ResizeObserver(sendResizeMessage);
        ro.observe(document.body);
      }
    })();
  </script>
