<!DOCTYPE html>
<html lang="pt-BR" data-theme="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Grade de Aulas e Apresentações - CathlabFlix SBHCI</title>
  <meta name="description" content="Grade completa de apresentações, conferências e downloads de slides PPTX do Congresso SOLACI-SBHCI 2026.">

  <!-- Favicon Oficial -->
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link rel="apple-touch-icon" href="/assets/images/favicon.png">

  <!-- Open Graph / Redes Sociais -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cathlabflix-sessions.vercel.app/new/aulas-solaci">
  <meta property="og:title" content="Grade de Aulas e Apresentações - SOLACI SBHCI 2026">
  <meta property="og:description" content="Consulte e faça o download oficial dos slides das aulas do Congresso SOLACI-SBHCI 2026.">
  <meta property="og:image" content="/assets/images/og-cathlabflix.png">

  <!-- Tipografia Montserrat Oficial SBHCI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Folhas de Estilo -->
  <link rel="stylesheet" href="/css/modern-ui.css">
  <link rel="stylesheet" href="/css/modern-aulas.css">

  <!-- Estilos Tema Azul SBHCI & Ajustes Específicos -->
  <style>
    :root {
      --color-bg-base: #010234 !important;
      --color-surface: #062257 !important;
      --color-surface-hover: #082b6e !important;
      --color-surface-elevated: #0a2d72 !important;
      --font-family-base: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }

    html, body {
      background-color: #010234 !important;
      color: #FFFFFF !important;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      min-height: 100vh;
      background-color: #010234 !important;
      display: flex;
      flex-direction: column;
    }

    .aulas-page-main {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding: 28px 24px 64px;
      box-sizing: border-box;
      flex: 1;
    }

    /* Barra de Retorno Limpa (Sem Breadcrumbs) */
    .aulas-top-nav-bar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 24px;
    }

    .aulas-back-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
      font-weight: 700;
      color: #FFFFFF;
      background: #062257;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 10px 18px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .aulas-back-link:hover {
      background: #082b6e;
      border-color: rgba(56, 189, 248, 0.5);
      color: #38bdf8;
      transform: translateX(-3px);
    }

    /* Cabeçalho Apenas com Título */
    .aulas-hero-header {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .aulas-header-title {
      font-size: clamp(1.6rem, 3.2vw, 2.35rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      margin: 0;
      line-height: 1.25;
    }

    @media (max-width: 768px) {
      .aulas-page-main {
        padding: 18px 14px 48px;
      }
      .aulas-top-nav-bar {
        margin-bottom: 16px;
      }
      .aulas-header-title {
        font-size: 1.45rem;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- ==========================================================================
         Conteúdo Principal da Grade de Aulas
         ========================================================================== -->
    <main class="aulas-page-main" id="aulasMainContent">

      <!-- Botão Voltar ao SOLACI -->
      <nav class="aulas-top-nav-bar" aria-label="Navegação de retorno">
        <a href="https://www.cathlabflix.org/solaci" target="_top" class="aulas-back-link" title="Voltar ao SOLACI">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Voltar ao SOLACI</span>
        </a>
      </nav>

      <!-- Cabeçalho (Apenas Título) -->
      <header class="aulas-hero-header">
        <h1 class="aulas-header-title">Grade de Aulas e Apresentações</h1>
      </header>

      <!-- Card Principal de Apresentações -->
      <section class="aulas-card-shell" aria-label="Navegador de Aulas e Apresentações">

        <!-- Nível 1: Barra de Dias (Dia 29 | Dia 30 | Dia 31) -->
        <div class="aulas-days-bar" id="aulasDaysBar" role="tablist" aria-label="Dias do Congresso">
          <!-- Renderizado dinamicamente via js/modern-aulas.js -->
        </div>

        <!-- Nível 2: Filtro de Salas/Arenas do Dia -->
        <div class="aulas-rooms-bar" id="aulasRoomsBar" role="tablist" aria-label="Salas do Congresso">
          <!-- Renderizado dinamicamente via js/modern-aulas.js -->
        </div>

        <!-- Nível 3: Barra de Ferramentas / Contador, Filtro de Período & Busca -->
        <div class="aulas-toolbar" id="aulasToolbar">
          <div class="aulas-count-badge" id="aulasCountBadge" aria-live="polite">
            Carregando apresentações...
          </div>

          <!-- Filtro de Período: Todos | Manhã | Tarde -->
          <div class="aulas-period-switch" id="aulasPeriodSwitch" role="tablist" aria-label="Filtrar apresentações por período do dia">
            <button type="button" class="aulas-period-btn active" data-period="all" role="tab" aria-selected="true" title="Exibir todas as apresentações">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="10" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span class="period-btn-label">Todos</span>
              <span class="period-btn-count" id="countAllPeriod">0</span>
            </button>

            <button type="button" class="aulas-period-btn" data-period="manha" role="tab" aria-selected="false" title="Exibir apenas apresentações da manhã (08:00 às 12:00)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
              <span class="period-btn-label">Manhã</span>
              <span class="period-btn-count" id="countManhaPeriod">0</span>
            </button>

            <button type="button" class="aulas-period-btn" data-period="tarde" role="tab" aria-selected="false" title="Exibir apenas apresentações da tarde (12:00 às 18:30)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 18a5 5 0 0 0-10 0"></path>
                <line x1="12" y1="9" x2="12" y2="2"></line>
                <line x1="4.22" y1="10.22" x2="5.64" y2="11.64"></line>
                <line x1="1" y1="18" x2="3" y2="18"></line>
                <line x1="21" y1="18" x2="23" y2="18"></line>
                <line x1="18.36" y1="11.64" x2="19.78" y2="10.22"></line>
                <line x1="23" y1="22" x2="1" y2="22"></line>
              </svg>
              <span class="period-btn-label">Tarde</span>
              <span class="period-btn-count" id="countTardePeriod">0</span>
            </button>
          </div>

          <div class="aulas-search-box">
            <svg class="aulas-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input 
              type="text" 
              class="aulas-search-input" 
              id="aulasSearchInput" 
              placeholder="Buscar palestrante ou tema..." 
              autocomplete="off"
              aria-label="Buscar palestrante ou tema"
            >
            <button type="button" class="aulas-search-clear" id="aulasSearchClearBtn" aria-label="Limpar busca" title="Limpar busca">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Nível 4: Lista de Accordions com os Cards de Download PPTX -->
        <div class="aulas-list-wrapper" id="aulasContainer" aria-label="Lista de apresentações">
          <!-- Renderizado dinamicamente via js/modern-aulas.js -->
        </div>

      </section>

    </main>

  </div>

  <!-- Script da Grade de Aulas -->
  <script src="/js/modern-aulas.js"></script>

</body>
</html>
